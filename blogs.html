<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>write your blog here</title>
    <!-- bootsrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- style css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navbar -->
    <div id="navbar">
        <!-- navbar content -->
    </div>


    <div class="page">

        <div class="top-actions">
            <button class="btn btn-primary">ADD BLOG POST</button>
        </div>

        <div class="card">
            <div class="image-select">
                <svg viewBox="0 0 24 24" fill="none" stroke="#9aa3ad" stroke-width="1.5">
                    <rect x="3" y="4" width="18" height="15" rx="1.5" />
                    <circle cx="8.5" cy="9.5" r="1.5" />
                    <path d="M21 15l-5-5-9 9" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>SELECT IMAGE</span>
            </div>

            <div class="fields">
                <div class="field-title">
                    <label for="blogTitle">Blog Title</label>
                    <input id="blogTitle" type="text" placeholder="Enter Blog Title">
                </div>

                <div class="row3">
                    <div>
                        <label for="author">Author</label>
                        <input id="author" type="text" value="Joe Smith">
                    </div>
                    <div>
                        <label for="moderator">Blog Moderator</label>
                        <select id="moderator">
                            <option>Joe Smith</option>
                            <option>Jane Doe</option>
                            <option>Alex Kim</option>
                        </select>
                        <div class="hint">Blog comments will be sent to the moderator</div>
                    </div>
                    <div>
                        <label for="publishDate">Publish Date</label>
                        <input id="publishDate" type="date" value="2023-02-22">
                    </div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="allowComments" checked>
                    <label for="allowComments" style="margin:0;">Allow Comments</label>
                </div>

                <div class="editor">
                    <div class="toolbar">
                        <span>¶ ▾</span>
                        <b style="font-size:12px;">B</b>
                        <i style="font-size:12px;">i</i>
                        <span style="text-decoration:underline;">U</span>
                        <span class="sep"></span>
                        <span>⇤</span><span>≡</span><span>⇥</span>
                        <span class="sep"></span>
                        <span>≔ ▾</span><span>≣ ▾</span>
                        <span class="sep"></span>
                        <span>66 ▾</span><span>A ▾</span>
                        <span class="sep"></span>
                        <span>🔗</span><span>🖼</span><span>▭</span><span>⌘ ▾</span>
                        <span style="margin-left:auto;">⇧ ↩ &lt;/&gt;</span>
                    </div>
                    <textarea placeholder="Type something"></textarea>
                </div>

                <div class="schedule-link">
                    <span class="plus">+</span>
                    <span>CREATE POST SCHEDULE FOR SOCIAL MEDIA</span>
                </div>

                <div class="footer-actions">
                    <button class="btn btn-ghost">CANCEL</button>
                    <button class="btn btn-dark">SAVE</button>
                </div>
            </div>
        </div>

    </div>


    <!-- supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- bootsrape js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- sweetalert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- javascript -->
    <script src="app.js"></script>
</body>

</html>
